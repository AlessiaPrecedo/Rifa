<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" defer src="../js/login-handler.js"></script>
    <title>Document</title>
  </head>
  <body>
    <form id="login-form">
      <input type="email" id="login-email" required placeholder="Admin Email" />
      <input
        type="password"
        id="login-password"
        required
        placeholder="Contraseña"
      />
      <button type="submit" id="btn-login">Ingresar</button>
      <p id="error-message" class="hidden"></p>
    </form>
  </body>
</html>
